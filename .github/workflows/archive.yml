name: archive
on:
  schedule: [{cron: "17 */6 * * *"}]   # every 6h, UTC
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: archive, cancel-in-progress: false}
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python archive.py
        env: {NED_TOKEN: "${{ secrets.NED_TOKEN }}"}
      - name: commit snapshot
        run: |
          git config user.name "archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "snapshot $(date -u +%FT%H%MZ)"
          git pull --rebase
          git push
